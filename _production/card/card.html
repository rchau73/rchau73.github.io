<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:627px;overflow:hidden;background:#101519;color:#e7e9e4;font-family:"IBM Plex Sans",Helvetica,sans-serif}
.wrap{position:absolute;inset:0;display:grid;grid-template-columns:470px 1fr;gap:36px;padding:56px 0 56px 64px;align-items:center}
.eyebrow{font:500 17px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#9aa5ad}
h1{font:600 52px/1.08 Fraunces,Georgia,serif;margin-top:18px}
h1 span{color:#4fcfb3}
.sub{font-size:22px;line-height:1.4;color:#9aa5ad;margin-top:22px}
.stats{display:flex;gap:28px;margin-top:30px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font:600 30px Fraunces,Georgia,serif}
.stats span{font-size:15px;color:#9aa5ad}
.url{font:500 18px "IBM Plex Mono",monospace;color:#4fcfb3;margin-top:30px}
.shot{height:515px;border:2px solid #2b363e;border-right:0;border-radius:14px 0 0 14px;overflow:hidden;background:#0d1117;position:relative}
.shot .bar{position:relative;z-index:2;height:34px;background:#161b22;border-bottom:1px solid #2b363e;font:500 15px "IBM Plex Mono",monospace;color:#9aa5ad;display:flex;align-items:center;padding-left:16px;gap:8px}
.shot .bar i{width:10px;height:10px;border-radius:50%;background:#2b363e;display:inline-block}
.shot img{position:absolute;top:34px;left:0;width:860px;transform:translate(-10px,-150px)}
</style></head><body><div class="wrap">
<div>
  <div class="eyebrow">Roberto Chau · AI-first engineering</div>
  <h1>A trading system built by a <span>governed team of AI agents</span></h1>
  <p class="sub">Agents do the work. A person merges every risky change.</p>
  <div class="stats"><div><b>302</b><span>PRs in a month</span></div><div><b>4 min</b><span>merge → live</span></div><div><b>1 %</b><span>change failure</span></div></div>
  <div class="url">rchau73.github.io</div>
</div>
<div class="shot"><div class="bar"><i></i><i></i><i></i>&nbsp;optionsBot monitor · Positions</div><img src="../shots/m_positions_full.png"></div>
</div></body></html>
